spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:file:./aerovault-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

app:
  jwt:
    secret: a_very_long_secure_secret_key_for_jwt_signing_1234567890
    expiration: 86400000

aws:
  s3:
    bucket: aerovault-storage
    region: us-east-1
    credentials:
      access-key: key
      secret-key: secret



