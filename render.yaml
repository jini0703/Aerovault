services:
  - type: web
    name: aerovault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerovault-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: aerovault-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: aerovault-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_S3_BUCKET
        value: aerovault-storage
      - key: AWS_REGION
        value: us-east-1

databases:
  - name: aerovault-db
    plan: free
    databaseName: aerovault
    user: aerovault_user
